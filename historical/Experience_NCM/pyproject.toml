[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-mac"
version = "0.2.0"
description = "Reproducible NCM Sudoku inference and exact-parity checks on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch==2.8.0", "numpy>=2,<3", "hydra-core==1.3.2"]

[project.scripts]
ncm-sudoku = "ncm_mac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
